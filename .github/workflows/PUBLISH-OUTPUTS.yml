# 由 CUSTOM/DEFAULT 在全部设备编译成功后调用，统一整理并发布本工作流的产物。
name: PUBLISH-OUTPUTS

on:
  workflow_call:
    inputs:
      WRT_FEED_HOST:
        required: true
        type: string
      WRT_RELEASE_FIRMWARE:
        required: true
        type: boolean
      WRT_RELEASE_PACKAGES:
        required: false
        type: boolean
        default: false
      WRT_UPLOAD_PACKAGES_ARTIFACT:
        required: false
        type: boolean
        default: true
      WRT_EXPECTED_BUILDS:
        required: true
        type: number
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: 整理固件与插件包并统一发布
    runs-on: ubuntu-24.04
    steps:
      - name: 检出项目
        uses: actions/checkout@v6

      # 每个 CORE 的 feed 中间产物只供本次发布任务汇总；固件 ZIP 单独供 Release 使用。
      - name: 下载本工作流的全部软件源中间产物
        uses: actions/download-artifact@v7
        with:
          pattern: '*-feed'
          path: build-artifacts
          merge-multiple: false

      - name: 下载单设备固件包
        uses: actions/download-artifact@v7
        with:
          pattern: '*-firmware'
          path: firmware-artifacts
          merge-multiple: false

      - name: 校验产物并按设备型号整理固件
        env:
          EXPECTED_BUILDS: ${{ inputs.WRT_EXPECTED_BUILDS }}
        run: |
          python3 Scripts/ci_build_outputs.py organize \
            --input build-artifacts --firmware-input firmware-artifacts \
            --output firmware --platform-firmware-output platform-firmware-archives \
            --work firmware-work \
            --feeds-output feed-artifacts --expected-count "$EXPECTED_BUILDS"

      - name: 按平台汇总插件并重建软件源索引
        id: merge
        env:
          EXPECTED_BUILDS: ${{ inputs.WRT_EXPECTED_BUILDS }}
          FEED_HOST: ${{ inputs.WRT_FEED_HOST }}
        run: |
          python3 Scripts/merge_apk_feeds.py \
            --input feed-artifacts --output public \
            --packages-output merged-feed-packages \
            --expected-count "$EXPECTED_BUILDS" --host "$FEED_HOST"

      - name: 单独整理 Artifact/Release 用的平台插件包
        run: |
          APK_TOOL=$(find feed-artifacts -path '*/tools/run-apk' -type f | sort | head -n1)
          if [ -z "$APK_TOOL" ]; then
            echo '【产物】缺少 APK 工具，无法校验插件目录中的依赖版本' >&2
            exit 1
          fi
          chmod +x "$APK_TOOL" "$(dirname "$APK_TOOL")/apk"
          python3 Scripts/ci_organize_apk_packages.py \
            --input merged-feed-packages/plugins --output plugin-archives \
            --artifact-output package-artifacts --apk "$APK_TOOL"

      - name: 保存平台 APK 包 Artifact
        if: inputs.WRT_UPLOAD_PACKAGES_ARTIFACT
        uses: actions/upload-artifact@v6.0.0
        with:
          name: apk-packages
          path: package-artifacts/
          compression-level: 0
          if-no-files-found: error

      - name: 检查 Cloudflare 发布凭据
        id: credentials
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_ACCOUNT_ID" ] && [ -n "$CF_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '【软件源】完整包已保存在 apk-packages 中按平台分目录保存；发布需要配置 CLOUDFLARE_ACCOUNT_ID 和 CLOUDFLARE_API_TOKEN'
          fi

      - name: 按源码短 Hash 部署软件源到 Cloudflare Pages
        if: inputs.WRT_FEED_HOST != '' && steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ steps.merge.outputs.project }}
          SOURCE_TAGS: ${{ steps.merge.outputs.source_tags }}
        run: |
          IFS=',' read -r -a source_tags <<< "$SOURCE_TAGS"
          for source_tag in "${source_tags[@]}"; do
            npx --yes wrangler@4 pages deploy public \
              --project-name="$PAGES_PROJECT" --branch="$source_tag"
          done

      - name: 发布按平台整理的固件与插件 Release
        if: inputs.WRT_RELEASE_FIRMWARE || inputs.WRT_RELEASE_PACKAGES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_FIRMWARE: ${{ inputs.WRT_RELEASE_FIRMWARE }}
          RELEASE_PACKAGES: ${{ inputs.WRT_RELEASE_PACKAGES }}
        run: |
          release_args=()
          if [ "$RELEASE_FIRMWARE" = "true" ]; then
            release_args+=(--firmware)
          fi
          if [ "$RELEASE_PACKAGES" = "true" ]; then
            release_args+=(--packages)
          fi
          python3 Scripts/ci_build_outputs.py release-platforms \
            --work firmware-work \
            --firmware-input platform-firmware-archives \
            --plugins-input plugin-archives "${release_args[@]}"
