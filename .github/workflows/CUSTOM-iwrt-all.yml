#CI项目
name: CUSTOM-IWRT-ALL
run-name: CUSTOM-IWRT-ALL-${{ inputs.SOURCE_TYPE }}-${{ inputs.WRT_RELEASE_FIRMWARE && 'release' || 'test' }}

#CI计划
on:
  # schedule:
  #   - cron: '0 3 1,15 * *'  # 每月1日 03:00 UTC
  workflow_dispatch:
    inputs:
      WHAT_MY_SAY:
        description: '编译说明'
        required: false
        type: string
        default: ''
      WRT_RELEASE_FIRMWARE:
        description: '是否发布'
        required: false
        type: boolean
        default: false
      SOURCE_TYPE:
        description: '源码类型（非 IPQ 设备自动使用官方 ImmortalWrt）'
        required: false
        type: choice
        options:
          - VIKINGYFY
          - libwrt
        default: 'libwrt'
      WRT_SOURCE_HASH_INFO:
        description: '源码 HASH，留空使用所选源码分支的最新提交'
        required: false
        type: string
        default: ''
      WRT_FEED_HOST:
        description: 'APK 软件源主机域名'
        required: false
        type: string
        default: 'lin-iwrt.pages.dev'

#CI权限
permissions: write-all

#CI任务
# 四个设备统一使用外部选择的 SOURCE_TYPE；非 IPQ 设备自动切换为官方 ImmortalWrt。
jobs:
  # cmiot_ax18_nowifi_fw4:
  #   name: cmiot-ax18-nowifi-fw4-base
  #   uses: ./.github/workflows/CORE-ALL.yml
  #   with:
  #     WRT_SOURCE_HASH_INFO: ${{ inputs.WRT_SOURCE_HASH_INFO }}
  #     WRT_FEED_HOST: ${{ inputs.WRT_FEED_HOST }}
  #     WRT_DEVICE: cmiot-ax18-nowifi
  #     SOURCE_TYPE: ${{ inputs.SOURCE_TYPE }}
  #     WRT_PACKAGE_MANAGER: apk
  #     WRT_FIREWALL: fw4
  #     WRT_OVERLAYS: ''
  #     WRT_DIY_SETTING: diy_config.sh
  #     WRT_DIYPackages: Packages.sh
  #     WRT_DIY_FEEDS: diy_feeds.sh
  #     WRT_DEFAULT_LANIP: 192.168.0.1
  #     WRT_RELEASE_FIRMWARE: ${{ github.event_name == 'workflow_dispatch' && inputs.WRT_RELEASE_FIRMWARE }}
  #     WRT_MINE_SAY: ${{ inputs.WHAT_MY_SAY }}
  #   secrets: inherit

  cmiot_ax18_nowifi_fw4_frps:
    name: cmiot-ax18-nowifi-fw4-frps
    uses: ./.github/workflows/CORE-ALL.yml
    with:
      WRT_SOURCE_HASH_INFO: ${{ inputs.WRT_SOURCE_HASH_INFO }}
      WRT_FEED_HOST: ${{ inputs.WRT_FEED_HOST }}
      WRT_DEVICE: cmiot-ax18-nowifi
      SOURCE_TYPE: ${{ inputs.SOURCE_TYPE }}
      WRT_PACKAGE_MANAGER: apk
      WRT_FIREWALL: fw4
      WRT_OVERLAYS: frps
      WRT_DIY_SETTING: diy_config.sh
      WRT_DIYPackages: Packages.sh
      WRT_DIY_FEEDS: diy_feeds.sh
      WRT_DEFAULT_LANIP: 192.168.0.1
      WRT_RELEASE_FIRMWARE: ${{ github.event_name == 'workflow_dispatch' && inputs.WRT_RELEASE_FIRMWARE }}
      WRT_MINE_SAY: ${{ inputs.WHAT_MY_SAY }}
    secrets: inherit

  gl_mt6000_nowifi_fw4:
    name: gl-mt6000-nowifi-fw4-base
    uses: ./.github/workflows/CORE-ALL.yml
    with:
      WRT_SOURCE_HASH_INFO: ${{ inputs.WRT_SOURCE_HASH_INFO }}
      WRT_FEED_HOST: ${{ inputs.WRT_FEED_HOST }}
      WRT_DEVICE: gl-mt6000-nowifi
      SOURCE_TYPE: ${{ inputs.SOURCE_TYPE }}
      WRT_PACKAGE_MANAGER: apk
      WRT_FIREWALL: fw4
      WRT_OVERLAYS: ''
      WRT_DIY_SETTING: diy_config.sh
      WRT_DIYPackages: Packages.sh
      WRT_DIY_FEEDS: diy_feeds.sh
      WRT_DEFAULT_LANIP: 192.168.0.1
      WRT_RELEASE_FIRMWARE: ${{ github.event_name == 'workflow_dispatch' && inputs.WRT_RELEASE_FIRMWARE }}
      WRT_MINE_SAY: ${{ inputs.WHAT_MY_SAY }}
    secrets: inherit

  gl_mt6000_wifi_fw4:
    name: gl-mt6000-wifi-fw4-base
    uses: ./.github/workflows/CORE-ALL.yml
    with:
      WRT_SOURCE_HASH_INFO: ${{ inputs.WRT_SOURCE_HASH_INFO }}
      WRT_FEED_HOST: ${{ inputs.WRT_FEED_HOST }}
      WRT_DEVICE: gl-mt6000-wifi
      SOURCE_TYPE: ${{ inputs.SOURCE_TYPE }}
      WRT_PACKAGE_MANAGER: apk
      WRT_FIREWALL: fw4
      WRT_OVERLAYS: ''
      WRT_DIY_SETTING: diy_config.sh
      WRT_DIYPackages: Packages.sh
      WRT_DIY_FEEDS: diy_feeds.sh
      WRT_DEFAULT_LANIP: 192.168.0.1
      WRT_RELEASE_FIRMWARE: ${{ github.event_name == 'workflow_dispatch' && inputs.WRT_RELEASE_FIRMWARE }}
      WRT_MINE_SAY: ${{ inputs.WHAT_MY_SAY }}
    secrets: inherit

  jd_ax6600_wifi_fw4:
    name: jd-ax6600-wifi-fw4-base
    uses: ./.github/workflows/CORE-ALL.yml
    with:
      WRT_SOURCE_HASH_INFO: ${{ inputs.WRT_SOURCE_HASH_INFO }}
      WRT_FEED_HOST: ${{ inputs.WRT_FEED_HOST }}
      WRT_DEVICE: jd-ax6600-wifi
      SOURCE_TYPE: ${{ inputs.SOURCE_TYPE }}
      WRT_PACKAGE_MANAGER: apk
      WRT_FIREWALL: fw4
      WRT_OVERLAYS: ''
      WRT_DIY_SETTING: diy_config.sh
      WRT_DIYPackages: Packages.sh
      WRT_DIY_FEEDS: diy_feeds.sh
      WRT_DEFAULT_LANIP: 192.168.0.1
      WRT_RELEASE_FIRMWARE: ${{ github.event_name == 'workflow_dispatch' && inputs.WRT_RELEASE_FIRMWARE }}
      WRT_MINE_SAY: ${{ inputs.WHAT_MY_SAY }}
    secrets: inherit
